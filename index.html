<div class="container">
    <h1>Hello, World! 🚀</h1>
    <p id="location-display">Detecting your city...</p>
</div>

<script>
    // Call the function we just created
    fetch('/geo')
        .then(res => res.json())
        .then(data => {
            document.getElementById('location-display').innerText = 
                `Greetings from ${data.city}, ${data.country}!`;
        })
        .catch(() => {
            document.getElementById('location-display').innerText = "Hello from the World!";
        });
</script>
